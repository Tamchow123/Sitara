name: CI

on:
  push:
  pull_request:

# Safety: CI never receives provider secrets and always runs fail-closed.
env:
  DEMO_MODE: "true"
  ALLOW_PAID_AI_CALLS: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sitara
          POSTGRES_PASSWORD: sitara-ci-password
          POSTGRES_DB: sitara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitara -d sitara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgres://sitara:sitara-ci-password@localhost:5432/sitara
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      # Storage checks are mocked in tests; these values point nowhere real.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder
      S3_BUCKET_NAME: sitara-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned to match the backend Docker image (python:3.12.7-slim-bookworm).
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies (hash-verified lock)
        run: pip install --require-hashes -r requirements.txt
      - name: Dependency lock freshness
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install "pip-tools==7.5.3"
          python -m piptools compile \
            --generate-hashes \
            --output-file requirements.txt \
            requirements.in
          git diff --exit-code -- requirements.txt
      - name: Ruff lint
        # The questionnaire-visuals build script lives in the web package but is
        # Python, and is outside every other toolchain here, so it is linted
        # against this project's ruff config rather than going unchecked.
        run: |
          ruff check .
          ruff check --config pyproject.toml ../web/scripts
      - name: Ruff format check
        run: |
          ruff format --check .
          ruff format --check --config pyproject.toml ../web/scripts
      - name: Django system check
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema freshness (contract-drift check)
        run: |
          python manage.py spectacular \
            --format openapi-json \
            --file openapi/schema.json \
            --validate \
            --fail-on-warn
          git diff --exit-code -- openapi/schema.json
      - name: Generated image freshness (asset drift check)
        # Rebuilt here rather than in the frontend job because Pillow arrives
        # pinned and hash-verified with the backend lock above, which is what
        # makes the rebuild reproducible. `git add` first so a NEW or DELETED
        # asset is caught too, not only a modified one.
        #
        # Both pipelines, in one step: they share the crop-and-encode helpers in
        # apps/web/scripts/imagekit.py, so a change there can drift either set
        # of assets and neither may be left unchecked.
        working-directory: .
        run: |
          python apps/web/scripts/build-questionnaire-images.py
          python apps/web/scripts/build-landing-images.py
          git add -A -- apps/web/public/questionnaire-visuals \
            apps/web/src/features/questionnaire/visuals/asset-integrity.json \
            apps/web/public/landing \
            apps/web/src/app/landing-hero.json
          git diff --cached --exit-code -- apps/web/public/questionnaire-visuals \
            apps/web/src/features/questionnaire/visuals/asset-integrity.json \
            apps/web/public/landing \
            apps/web/src/app/landing-hero.json
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Server-only rewrite target; never reaches browser bundles.
      API_INTERNAL_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API types freshness (contract-drift check)
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  # Phase 17 §25: the §25 journeys driven against the real stack, in demo mode.
  #
  # Runs the FUNCTIONAL specs only, never the visual project: Playwright suffixes
  # every baseline with the recording OS, and the committed set is `-win32`, so a
  # Linux runner has no reference to compare against. Recording a parallel Linux
  # set here would be baselining screenshots nobody has ever looked at, which is
  # worse than not checking them — visual regression stays a local gate, and
  # apps/web/e2e/README.md says so.
  e2e:
    runs-on: ubuntu-latest
    # Fail fast on the cheap jobs first: this one builds images, boots six
    # services and runs real Celery work, so there is no sense paying for it
    # when a lint or unit-test failure already condemns the commit.
    needs: [backend, frontend]
    # Comfortably above the ~10-minute local runtime, but far below GitHub's
    # 360-minute default — a hung compose service should fail, not idle.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start the stack (gates closed)
        env:
          # Explicit and redundant with the compose defaults: this is the one
          # place a reviewer looks to confirm CI cannot spend money, so it does
          # not rely on a default several files away. safety.spec.ts then
          # asserts the RUNNING stack agrees.
          DEMO_MODE: "true"
          ALLOW_PAID_AI_CALLS: "false"
          LIVE_GENERATION_ENABLED: "false"
          # The maximum the setting allows, so the narrated stages are
          # observable rather than a blur.
          DEMO_STAGE_DELAY_MS: "5000"
        run: docker compose up -d --wait api celery web
      - name: Wait for the web and API origins to serve
        # `--wait` above only blocks on services that DEFINE a healthcheck.
        # `celery` and `web` do not, so it returns as soon as their containers
        # are "running" — before `next dev` has bound its listener. Without
        # this, the first page.goto() can hit ERR_CONNECTION_REFUSED, which
        # Playwright does not retry through, and the run fails on
        # infrastructure timing.
        #
        # This verifies the two HTTP origins only. The Celery worker's queue
        # subscription is NOT checked here: it is covered incidentally by the
        # minutes of `npm ci` and browser install that follow, and by the
        # generation specs' own 150s result wait. Said plainly so nobody reads
        # this step as a worker-readiness gate that it is not.
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/ >/dev/null                && curl -fsS http://localhost:8000/api/v1/health/live >/dev/null; then
              echo "web and api are serving"; exit 0
            fi
            sleep 5
          done
          echo "web or api never became reachable"; docker compose ps; exit 1
      - name: Publish the questionnaire
        # A CI database is built fresh every run and no migration publishes a
        # questionnaire, so without this `/design/new` renders no questions and
        # every journey fails on a missing radio. Reads a committed fixture and
        # hands it to the one service allowed to activate a version.
        run: docker compose exec -T api python manage.py seed_questionnaire
      - name: Install the deterministic demo fixture pack
        # Locally generated synthetic assets: zero-cost, no provider call, no
        # downloaded or unlicensed image (CLAUDE.md §13).
        run: docker compose exec -T api python manage.py install_demo_asset_pack --dev-synthetic
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end journeys
        working-directory: apps/web
        run: npm run e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200 api celery web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
